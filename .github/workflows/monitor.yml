name: Outage monitor

on:
  schedule:
    # GitHub runs schedules on a best-effort basis and may start them hours
    # late on a quiet repo. So each scheduled run stays alive and checks every
    # interval_seconds (5 min) for ~5h40m, the next run waits in the queue,
    # and starts as soon as the current one finishes - continuous coverage.
    # This cron only needs to keep a run queued. Minute 17 avoids the
    # top-of-the-hour rush on GitHub's scheduler.
    - cron: "17 * * * *"
  workflow_dispatch:      # "Run workflow" button for manual runs
    inputs:
      test_email:
        description: "Also send a test email (checks your SMTP settings)"
        type: boolean
        default: false

# One scheduled monitor at a time; the next one waits in the queue. Manual
# runs use their own group so "Run workflow" doesn't wait behind a 6h run.
concurrency:
  group: outage-monitor-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub's maximum job length is 360
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_FROM: ${{ secrets.ALERT_FROM }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # state.json remembers what's down between runs (so you get one alert,
      # not one every 5 minutes). Each run saves a new cache entry and the
      # next run restores the most recent one.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: outage-state-${{ github.run_id }}
          restore-keys: outage-state-

      - name: Send test email
        if: ${{ inputs.test_email }}
        run: python -m outage_detector test-email

      - name: Run checks
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m outage_detector run --duration 340
          else
            python -m outage_detector run --once
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: outage-state-${{ github.run_id }}
